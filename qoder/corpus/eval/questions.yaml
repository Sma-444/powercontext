# 标注集：每题的「正确证据」写成人能核对的位置。
#
# doc + pages      适用于 PDF（页码从 1 开始，可以在 PDF 阅读器里直接翻到）
# doc + section    适用于 Markdown 笔记（小节标题包含即可）
# must_include     可选：抽取式回答里应当出现的字符串（用于衡量回答覆盖）
